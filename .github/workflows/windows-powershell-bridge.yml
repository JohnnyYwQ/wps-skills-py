name: Windows PowerShell bridge

on:
  push:
    paths:
      - "bridge/wps_excel.py"
      - "bridge/wps_ppt.py"
      - "bridge/wps_word.py"
      - "bridge/powershell_contracts.py"
      - "scripts/test_windows_powershell_parse.ps1"
      - ".github/workflows/windows-powershell-bridge.yml"
  pull_request:
    paths:
      - "bridge/wps_excel.py"
      - "bridge/wps_ppt.py"
      - "bridge/wps_word.py"
      - "bridge/powershell_contracts.py"
      - "scripts/test_windows_powershell_parse.ps1"
      - ".github/workflows/windows-powershell-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse-windows-powershell:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Parse generated bridge scripts with Windows PowerShell
        shell: powershell
        run: .\scripts\test_windows_powershell_parse.ps1 -PythonExe python
